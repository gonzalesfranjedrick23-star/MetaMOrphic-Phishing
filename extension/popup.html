<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSentinel</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      width: 320px; margin: 0; padding: 14px; background: #0b1220; color: #e5e7eb;
    }
    .hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .hdr img { width: 30px; height: 30px; border-radius: 8px; }
    .hdr b { font-size: 15px; color: #f8fafc; }
    .status { display: flex; align-items: center; justify-content: space-between;
      background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot.active { background: #22c55e; } .dot.degraded { background: #f59e0b; } .dot.offline { background: #ef4444; }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #374151; border-radius: 24px; transition: .3s; cursor: pointer; }
    .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background: #2563eb; }
    input:checked + .slider:before { transform: translateX(18px); }
    .site { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .site .host { font-size: 13px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .verdict { font-size: 20px; font-weight: 800; margin: 4px 0; }
    .site .why { font-size: 12px; color: #9ca3af; line-height: 1.4; }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 7px 0; }
    section { border-top: 1px solid #1f2937; padding-top: 8px; margin-top: 8px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #94a3b8; margin: 4px 0 6px; }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; }
    .cats label { font-size: 12px; background: #1f2937; border-radius: 6px; padding: 3px 7px; cursor: pointer; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff; margin-top: 6px; }
    button.secondary { background: #374151; color: #e5e7eb; }
    #trustedList { list-style: none; margin: 0; padding: 0; max-height: 110px; overflow-y: auto; }
    #trustedList li { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 4px; }
    #trustedList .remove { border: 0; background: none; color: #f87171; cursor: pointer; width: auto; margin: 0; padding: 0 4px; }
    #trustedEmpty, .note { font-size: 11px; color: #6b7280; }
    #feedbackStatus { font-size: 11px; color: #34d399; min-height: 1em; }
    .stats .row { font-size: 12px; }
    @media (prefers-color-scheme: light) {
      body { background: #f1f5f9; color: #0f172a; }
      .status, .site { background: #fff; border-color: #e2e8f0; }
      section { border-color: #e2e8f0; }
      .cats label { background: #e2e8f0; }
    }
  </style>
</head>
<body>
  <div class="hdr">
    <img src="../images/cybersentinel-logo.svg" alt="" />
    <b>CyberSentinel</b>
  </div>

  <div class="status">
    <span><span class="dot offline" id="protDot"></span><b id="protState">Checking&hellip;</b></span>
    <label class="switch"><input type="checkbox" id="toggleSwitch" /><span class="slider"></span></label>
  </div>
  <div class="note" id="protDetail" style="margin:-4px 0 10px;"></div>

  <div class="site">
    <div class="host" id="siteHost">&mdash;</div>
    <div class="verdict" id="siteVerdict">&mdash;</div>
    <div class="why" id="siteWhy"></div>
    <button class="secondary" id="scanBtn">Scan Again</button>
  </div>

  <section>
    <h2>Content Filter</h2>
    <div class="row">
      <span>Block configured categories</span>
      <label class="switch"><input type="checkbox" id="cfToggle" /><span class="slider"></span></label>
    </div>
    <div class="cats" id="cfCats"></div>
  </section>

  <section>
    <h2>Download Protection</h2>
    <div class="row">
      <span>Check downloads for malicious files</span>
      <label class="switch"><input type="checkbox" id="dlToggle" /><span class="slider"></span></label>
    </div>
  </section>

  <section>
    <h2>Trusted sites</h2>
    <p id="trustedEmpty">No trusted sites yet.</p>
    <ul id="trustedList"></ul>
  </section>

  <section id="ossSection" style="display:none">
    <h2>Self-learning (open-source build)</h2>
    <button id="markPhishingBtn">Mark this site as phishing</button>
    <p id="feedbackStatus"></p>
    <div class="stats">
      <div class="row"><span>Feedback points</span><b id="statCount">0</b></div>
      <div class="row"><span>Last updated</span><b id="statUpdated">&mdash;</b></div>
      <div class="row"><span>Held-out accuracy</span><b id="statAcc">&mdash;</b></div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
